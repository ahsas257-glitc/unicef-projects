[client]
toolbarMode = "minimal"
showErrorDetails = "none"
showErrorLinks = false
showSidebarNavigation = false

[theme]
base = "dark"
primaryColor = "#3B82F6"
backgroundColor = "#07111F"
secondaryBackgroundColor = "#0B192B"
textColor = "#E8F0FB"
linkColor = "#38BDF8"
borderColor = "#1E334D"
dataframeBorderColor = "#1E334D"
dataframeHeaderBackgroundColor = "#10223A"
showWidgetBorder = true
showSidebarBorder = true

[theme.light]
primaryColor = "#3B82F6"
backgroundColor = "#07111F"
secondaryBackgroundColor = "#0B192B"
textColor = "#E8F0FB"
linkColor = "#38BDF8"
borderColor = "#1E334D"
dataframeBorderColor = "#1E334D"
dataframeHeaderBackgroundColor = "#10223A"
showWidgetBorder = true

[theme.dark]
primaryColor = "#3B82F6"
backgroundColor = "#07111F"
secondaryBackgroundColor = "#0B192B"
textColor = "#E8F0FB"
linkColor = "#38BDF8"
borderColor = "#1E334D"
dataframeBorderColor = "#1E334D"
dataframeHeaderBackgroundColor = "#10223A"
showWidgetBorder = true

[theme.sidebar]
primaryColor = "#3B82F6"
backgroundColor = "#081421"
secondaryBackgroundColor = "#10223A"
textColor = "#E8F0FB"
linkColor = "#38BDF8"
borderColor = "#1E334D"

[theme.light.sidebar]
primaryColor = "#3B82F6"
backgroundColor = "#081421"
secondaryBackgroundColor = "#10223A"
textColor = "#E8F0FB"
linkColor = "#38BDF8"
borderColor = "#1E334D"

[theme.dark.sidebar]
primaryColor = "#3B82F6"
backgroundColor = "#081421"
secondaryBackgroundColor = "#10223A"
textColor = "#E8F0FB"
linkColor = "#38BDF8"
borderColor = "#1E334D"

[server]
headless = true
enableXsrfProtection = true
runOnSave = false
maxUploadSize = 50

[browser]
gatherUsageStats = false
